name: KI Video Studio Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - ".github/workflows/mobile-app-android.yml"

permissions:
  contents: read

jobs:
  build-android-release-app:
    name: Android-Release-App erstellen
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js vorbereiten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Java vorbereiten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: App-Abhängigkeiten installieren
        run: npm ci

      - name: App prüfen
        run: npm run typecheck

      - name: Android-Projekt erzeugen
        run: npx expo prebuild --platform android --clean --no-install

      - name: Eigenständig startende Release-APK erstellen
        run: ./gradlew assembleRelease
        working-directory: mobile-app/android

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ki-video-studio-android-release-app
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
